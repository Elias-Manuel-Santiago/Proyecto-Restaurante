<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#762e39" />
    <meta
      name="description"
      content="NÁCAR Restaurante · Salón, cocina y administración al mismo ritmo."
    />
    <title>NÁCAR Restaurante</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello claro).
      try {
        var tema = localStorage.getItem('nacar-tema')
        if (tema === 'light' || tema === 'dark')
          document.documentElement.dataset.theme = tema
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
