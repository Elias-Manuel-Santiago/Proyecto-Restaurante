<rect x="840" y="1040" width="340" height="68" fill="#244769"/>
<text x="852" y="1063" font-size="12" style="fill:white">«servicio externo HTTPS»</text>
<text class="title" x="852" y="1090" font-size="19" style="fill:white">MercadoPagoAPI</text>
<text class="row" x="852" y="1134">GET /users/me</text>
<text class="row" x="852" y="1162">POST /checkout/preferences</text>
<text class="row" x="852" y="1190">GET /v1/payments/search</text>
<text class="row" x="852" y="1218">PUT /checkout/preferences/{id}</text>
<text class="row" x="852" y="1246">PUT /v1/payments/{id}</text>
<text class="row" x="852" y="1274">POST /v1/payments/{id}/refunds</text>
<rect x="1240" y="1040" width="340" height="254" rx="6" fill="white" stroke="#94a3b8"/>
