<polyline points="1240,1160 1180,1160" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="1185" y="1146" font-size="12">HTTPS</text>
<text x="40" y="1360" font-size="14">Los rectángulos con «módulo» o «componente» representan funciones reales; el código no declara clases JavaScript.</text>
<text x="40" y="1386" font-size="14">PasarelaPago es un contrato estructural documentado: el registro permite agregar adaptadores sin reescribir pedidos.</text>
<text x="40" y="1412" font-size="14">Pedido y Pago son objetos del modelo relacional (atributos principales). Relación: un pedido tiene cero o un pago.</text>
<text x="40" y="1438" font-size="14">El QR y el enlace abren el checkout público del pedido en el celular del cliente; no comparten la sesión del administrador.</text>
<text x="40" y="1464" font-size="14">NÁCAR confirma el pago consultando la API; cancelación previa al despacho solicita devolución con clave idempotente.</text>
</svg>