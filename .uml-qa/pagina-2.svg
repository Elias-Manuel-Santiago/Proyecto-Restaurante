<text x="78" y="597" font-size="16">EstadoEnvio = pendiente | en_camino | entregado.</text>
<text x="78" y="620" font-size="16">Moto propia exige dirección y repartidor activo.</text>
<text x="78" y="643" font-size="16">Cadetería exige dirección, sin repartidor interno.</text>
<text x="78" y="666" font-size="16">Retiro local: sin dirección ni repartidor.</text>
<text x="78" y="689" font-size="16">El costo aplicado se conserva al cambiar la tarifa.</text>
<rect x="60" y="1030" width="1530" height="145" fill="#fff8e5" stroke="#bd9637"/>
<text x="78" y="1057" font-size="16">Para retirar o entregar: pedido listo y pago aprobado. La entrega actualiza Pedido a entregado.</text>
<text x="78" y="1080" font-size="16">AsignarRepartidor representa la asignación validada al crear el envío; no presupone una pantalla de reasignación.</text>
