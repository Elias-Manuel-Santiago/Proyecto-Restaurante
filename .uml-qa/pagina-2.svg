<text x="60" y="66" font-size="30" font-weight="700">02 · Clases — Envíos y reparto</text>
<text x="60" y="116" font-size="17" font-weight="400">Las clases marcadas «referencia» son las mismas clases del modelo, repetidas para facilitar la lectura.</text>
