<text x="78" y="1107" font-size="16">TipoMovimiento = consumo | reposicion | ajuste. Consumo y reposición tienen pedido; ajuste no.</text>
<text x="78" y="1130" font-size="16">El stock se reserva al crear el pedido (también si el envío espera pago) y se devuelve al cancelar.</text>
<text x="78" y="1153" font-size="16">La cola es temporal, no se persiste. Solo permite reordenar pedidos activos del mismo estado.</text>
