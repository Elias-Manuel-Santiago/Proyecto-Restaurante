<text x="60" y="66" font-size="30" font-weight="700">05 · Clases — Acceso, equipo y resúmenes</text>
<text x="60" y="116" font-size="17" font-weight="400">Los roles se modelan como un atributo de Usuario; los permisos no requieren subclases con herencia artificial.</text>
<text x="60" y="1238" font-size="15" font-weight="400">Modelo POO propuesto · − privado · + público · / derivado · ◆ composición · Línea continua: asociación · Flecha discontinua: dependencia</text>
<text x="60" y="1277" font-size="13" font-weight="400">NÁCAR · Proyecto Restaurante | Modelo conceptual basado en la implementación actual</text>
