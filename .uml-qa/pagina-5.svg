<text x="78" y="597" font-size="16">Rol = admin | mozo | chef | repartidor. Pedido conserva mozoId y mozoNombre como datos históricos.</text>
<text x="78" y="620" font-size="16">MovimientoStock.usuarioId es opcional. No se modelan clientes como usuarios: el sistema es interno.</text>
<text x="78" y="643" font-size="16">Categoria = Entradas | Principales | Postres | Bebidas. ? indica que un valor puede ser nulo.</text>
<rect x="60" y="1090" width="1530" height="105" fill="#fff8e5" stroke="#bd9637"/>
<text x="78" y="1117" font-size="16">Diseño conceptual POO: las operaciones trasladan responsabilidades de los módulos actuales a objetos.</text>
<text x="78" y="1140" font-size="16">Los atributos son una selección del dominio. «referencia» repite una clase; no define una clase distinta.</text>
<text x="78" y="1163" font-size="16">Decimal, DateTime, UUID, Checkout y ResultadoPago son tipos de valor o contratos conceptuales.</text>
